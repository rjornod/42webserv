server {
    listen 8080;
		autoindex on;
		
    error_page 404 /error_pages/404.html;
    allowed_methods GET;
    root ./data/www;
    index index.html secret.html;
   
    client_max_body_size 2147483640;

		location / {
			allowed_methods GET POST;
		}

    location /upload {
			allowed_methods GET POST DELETE;
			upload_store /www/uploads;
    }

    location /cgi-bin {
			autoindex off;
			allowed_methods GET POST;
			cgi_handler .py /usr/bin/python3;
		}

    location /redirect {
			return  302 https://web.archive.org/web/19991129021746/http://www13.google.com/;
    }

    location /img {
			autoindex on;
      allowed_methods GET POST DELETE;
    }
}


server {
    listen 8041; 
    root ./data/www2;
    index index.html;
		client_max_body_size 30000;
		location / {
			allowed_methods GET POST;
			autoindex on;
    }
}
