<html>
	<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>FILE UPLOAD // WEBSERVER.EXE</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/style.css">
	<link rel="stylesheet" href="/error-pages.css">
	</head>
	<body>
		<main class="error-shell">
			<div class="error-window">
				<div class="error-titlebar">
					<span>WEBSERVER.EXE</span>
					<span>[ X ]</span>
				</div>
				<div class="error-content">
					<img src="/img/fire-up.gif" alt="Animated flames">
					<h1>FILE UPLOAD</h1>
					<form class="upload-form" method="POST" enctype="multipart/form-data">
						<label class="upload-label" for="upload">CHOOSE A FILE TO UPLOAD:</label>
						<input class="upload-input" type="file" id="upload" name="image" accept="image/*,video/*,audio/*,text/plain">
						<button class="upload-submit" type="submit">SUBMIT</button>
					</form>
					<img src="/img/fire.gif" alt="Animated flames">
					<p class="error-footer">ready // select payload and transmit</p>
				</div>
			</div>
		</main>
	</body>
</html>
